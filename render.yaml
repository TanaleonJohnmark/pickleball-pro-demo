# Pickleball Pro by JT — public live demo. Render: New → Blueprint → this repo.
# Database: Neon (free). Paste the Neon connection string into DATABASE_URL on Render.
services:
  - type: web
    name: pickleball-pro-demo
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: CLUB_TIMEZONE
        value: Asia/Manila
      - key: DATABASE_URL
        sync: false
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_RESET_HOURS
        value: "6"
      - key: DEMO_CONTACT_URL
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false